server {
    listen 80;
    server_name _;

    # Backend API, reached only through this same-origin proxy -- the
    # browser never talks to the app service directly, so it needs no
    # CORS configuration.
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: let Vue Router handle any path that isn't a real file.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
