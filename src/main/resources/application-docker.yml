# Activated with `docker` profile: points at the Postgres/Redis/RabbitMQ
# containers from docker-compose.yml.
#
# Note the two database identities. Flyway connects as the owning role to
# create and alter tables; the application itself connects as ledgerflow_app,
# which is deliberately not a superuser so that row-level security actually
# applies to it (see V10).
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ledgerflow}
    username: ${POSTGRES_APP_USER:ledgerflow_app}
    password: ${POSTGRES_APP_PASSWORD:app-change-me}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ledgerflow}
    user: ${POSTGRES_USER:ledgerflow}
    password: ${POSTGRES_PASSWORD:change-me}
    placeholders:
      app_password: ${POSTGRES_APP_PASSWORD:app-change-me}
      admin_password: ${POSTGRES_ADMIN_PASSWORD:admin-change-me}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:ledgerflow}
    password: ${RABBITMQ_DEFAULT_PASS:change-me}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ledgerflow-worker}

# The poller's own connection, as the BYPASSRLS role created in V11. Only the
# worker profile builds this pool -- see OutboxConfig.
ledgerflow:
  outbox:
    datasource:
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ledgerflow}
      username: ${POSTGRES_ADMIN_USER:ledgerflow_admin}
      password: ${POSTGRES_ADMIN_PASSWORD:admin-change-me}
